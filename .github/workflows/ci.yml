name: Production Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
    
      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Production smoke test
        run: |
          npm run start -- -p 3000 > /tmp/carry-the-boats.log 2>&1 &
          APP_PID=$!
          trap "kill $APP_PID || true" EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000 | grep -q "Carry the Boats — Training System"; then
              echo "Production server is serving the app."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/carry-the-boats.log
          exit 1
